on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore src/ShortLink.Api/ShortLink.Api.csproj
      - name: Build
        run: dotnet build src/ShortLink.Api/ShortLink.Api.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test src/ShortLink.Api/ShortLink.Api.csproj --no-build --verbosity normal