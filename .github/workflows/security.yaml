name: Security Scan

on:
  workflow_call:

jobs:
  security:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Install Security Code Scan analyzer
        run: dotnet add src/ShortLink.Api/ShortLink.Api.csproj package SecurityCodeScan.VS2019 --version 5.6.7
      - name: Run Security Code Scan
        run: dotnet build src/ShortLink.Api/ShortLink.Api.csproj --configuration Release --no-restore --warnaserror -p:ErrorLog=security-report.sarif
      - name: Upload Security Report
        if: always() && hashFiles('security-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-report.sarif