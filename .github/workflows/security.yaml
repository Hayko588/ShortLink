on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Install Security Code Scan
        run: dotnet tool install --global SecurityCodeScan.Tool --version 5.0.0
      - name: Run Security Code Scan
        run: dotnet security-code-scan analyze src/ShortLink.Api/ShortLink.Api.csproj --output-format SARIF --output-file security-report.sarif
      - name: Upload Security Report
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: security-report.sarif