---
- name: Configure baseline packages
  hosts: shortlink-web
  become: true
  tasks:
    - name: Refresh the apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
          - jq
          - htop
          - unattended-upgrades
